<figure
  id="pdf-icon" class="fcc" title="Mon CV au format PDF"
  [ngStyle]="{opacity: isLoadingData ? 0.5 : 1}"
  [ngClass]="{'no-pointer-events': isLoadingData}"
  (click)="!downloading && !isLoadingData ? downloadCV() : null"
>
  <img
    class="fx-shake"
    src="assets/img/pdf-web.png"
    alt="Téléchargement du CV en PDF" aria-label="Download CV Pdf"
    [ngStyle]="{'width': mobile ? '80px' : '120px', 'height': mobile ? '30px' : '44px'}">
</figure>
