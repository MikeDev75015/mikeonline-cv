<app-page-layout
  sectionId="PORTFOLIO"
  [pageTitle]="'components.portfolio.title'"
  [elementsNumber]="projectList.length"
  [isLoadingData$]="isLoadingData$"
>
  <ng-container>
    <div
      [@showHideBackgroundImage]="showImage ? 'show' : 'hide'"
      class="full-screen"
      style="background-position: center; background-repeat: no-repeat; background-size: cover; opacity: 0; pointer-events: none;"
      [ngStyle]="{backgroundImage: backgroundImage ? 'url(' + backgroundImage + ')' : ''}"
    ></div>

    <div *ngIf="projectList.length" class="pf_flip w100 fcc">
      <app-project-item
        *ngFor="let project of projectList"
        class="app-portfolio-item"
        [project]="project"
        (mouseenter)="onLoadBackgroundImage(project)"
        (mouseleave)="onRemoveBackgroundImage()"
      ></app-project-item>
    </div>
  </ng-container>
</app-page-layout>
