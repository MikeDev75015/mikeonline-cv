<div *ngIf="siteDemo && siteDemo.pictureList && siteDemo.pictureList.length" class="p_conteneur">
  <div class="p_main">
    <figure class="p_face">
      <img
        [src]="siteDemo.pictureList[0].src"
        [alt]="siteDemo.pictureList[0].alt"
        [title]="siteDemo.pictureList[0].title">
      <p>
        <span
          [ngStyle]="
            siteDemo.styles &&
            siteDemo.styles[mobileView ? 'mobileView' : 'classicView'] &&
            siteDemo.styles[mobileView ? 'mobileView' : 'classicView'].title
              ? siteDemo.styles[mobileView ? 'mobileView' : 'classicView'].title
              : {}
          "
        >{{ siteDemo.title }}</span>
        <span>{{ siteDemo.subTitle }}</span>
      </p>
    </figure>
    <ul class="p_dos"
        [ngStyle]="{'cursor': siteDemo.link && siteDemo.link.url ? 'pointer': 'default'}"
        (click)="siteDemo.link && siteDemo.link.url ? openLinkInTab(siteDemo.link.url) : null">
      <li><p>Technos utilisées</p></li>
      <li *ngFor="let techno of siteDemo.technoList">{{ techno }}</li>
    </ul>
  </div>
</div>
