<div *ngIf="formation" class="line-header fbs w100" style="position: relative;">
  <div class="w100 fss column">
    <h3 class="fss wrap" [innerHTML]="formation.title"></h3>
    <em [innerHTML]="(formation.society ? formation.society + ' - ' : '') + formation.place | incompressibleSpace"></em>
  </div>

  <app-item-dates [item]="{ startDate: formation.beginDate, endDate: formation.endDate! }"></app-item-dates>

</div>

<app-item-tag-list [tagList]="formation?.tagList"></app-item-tag-list>

<div
  class="line-body w100"
  [ngStyle]="{
    'margin-bottom': enableOpenCloseButtons && opened ? '30px' : '0',
    'overflow': opened && !masked ? overflow : 'hidden',
    'padding-left': overflow === 'hidden' || (overflow === 'auto' && (!opened || masked)) ? lineBodyPaddingLeft : '30px'
  }"
  [@FormationItemComponentInOut]="opened ? 'in' : 'out'"
  (@FormationItemComponentInOut.start)="onAnimation($event)"
  (@FormationItemComponentInOut.done)="onAnimation($event)"
>
  <div
    *ngIf="formation && formation.detailList"
    [id]="'formation-detail-list-' + index"
    class="fss w100 column"
  >
    <app-formation-item-detail *ngFor="let detail of formation.detailList" [detail]="detail">
    </app-formation-item-detail>
  </div>
</div>

<app-item-open-close-buttons
  [enableOpenCloseButtons]="enableOpenCloseButtons" [masked]="masked" [opened]="opened" [btnOpen]="btnOpen"
  (onToggleView)="toggleView($event)"
></app-item-open-close-buttons>
