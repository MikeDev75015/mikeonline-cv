<section id="FORMATIONS" class="fsc column w100">
  <ng-container *appLoading="isLoadingData">
    <h3 class="animated-background">
    <span>
      mes formations
      <span *ngIf="formationList" class="badge-element">{{ formationList.length }}</span>
    </span>
    </h3>

    <div *ngIf="formationList" class="exp w100 column fsc">
      <ng-container *ngFor="let form of formationList; let i = index">
        <app-item
          [id]="'formation-item-' + i"
          [itemData]="form"
          [index]="i"
          itemType="formationItem"
          class="fss w70 column form-line"
        ></app-item>
      </ng-container>
    </div>
  </ng-container>
</section>
