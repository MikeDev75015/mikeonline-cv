<div *ngIf="experience" class="line-header fbs w100" style="position: relative;">
  <div class="w100 fss column">
    <h3 class="fss wrap" [innerHTML]="experience.title"></h3>
    <em [innerHTML]="(experience.society ? experience.society + ' - ' : '') + experience.place | incompressibleSpace"></em>
  </div>

  <app-item-dates [item]="{ startDate: experience.beginDate, endDate: experience.endDate! }"></app-item-dates>

</div>

<app-item-tag-list [tagList]="experience?.tagList"></app-item-tag-list>

<div
  class="line-body w100"
  [ngStyle]="{
    'margin-bottom': enableOpenCloseButtons && opened ? '30px' : '0',
    'overflow': opened && !masked ? overflow : 'hidden',
    'padding-left': overflow === 'hidden' || (overflow === 'auto' && (!opened || masked)) ? lineBodyPaddingLeft : '30px'
  }"
  [@ExperienceItemComponentInOut]="opened ? 'in' : 'out'"
  (@ExperienceItemComponentInOut.start)="onAnimation($event)"
  (@ExperienceItemComponentInOut.done)="onAnimation($event)"
>
  <div
    *ngIf="experience && experience.detailList"
    [id]="'experience-detail-list-' + index"
    class="fss w100 column"
  >
    <app-experience-item-detail *ngFor="let detail of experience.detailList" [detail]="detail">
    </app-experience-item-detail>
  </div>
</div>

<app-item-open-close-buttons
  [enableOpenCloseButtons]="enableOpenCloseButtons" [masked]="masked" [opened]="opened" [btnOpen]="btnOpen"
  (onToggleView)="toggleView($event)"
></app-item-open-close-buttons>
