<section id="EXPERIENCES" class="fsc column w100">
  <ng-container *appLoading="isLoadingData">
    <h3 class="animated-background">
    <span>
      mes expériences
      <span *ngIf="experienceList" class="badge-element">{{ experienceList.length }}</span>
    </span>
    </h3>

    <div *ngIf="experienceList" class="exp w100 column fsc">
      <ng-container *ngFor="let exp of experienceList; let i = index">
        <app-item
          [id]="'experience-item-' + i"
          [itemData]="exp"
          [index]="i"
          itemType="experienceItem"
          class="fss w70 column exp-line"
        ></app-item>
      </ng-container>
    </div>
  </ng-container>
</section>
