<app-page-layout
  sectionId="EXPERIENCES"
  pageTitle="mes expériences"
  [elementsNumber]="experienceList ? experienceList.length : 0"
  [isLoadingData]="isLoadingData"
>
  <ng-container *ngIf="experienceList">
    <div class="exp w100 column fsc">
      <ng-container *ngFor="let exp of experienceList; let i = index">
        <app-item
          [id]="'experience-item-' + i"
          [itemData]="exp"
          [index]="i"
          itemType="experienceItem"
          class="fss w70 column exp-line"
        ></app-item>
      </ng-container>
    </div>
  </ng-container>
</app-page-layout>
