<app-page-layout
  sectionId="FORMATIONS"
  [pageTitle]="'components.formations.title'"
  [elementsNumber]="formationList ? formationList.length : 0"
  [isLoadingData$]="isLoadingData$"
>
  <ng-container *ngIf="formationList">
    <div class="exp w100 column fsc" aria-labelledby="formations content">
      <ng-container *ngFor="let form of formationList; let i = index">
        <app-item
          [id]="'formation-item-' + i"
          [itemData]="form"
          [index]="i"
          itemType="formationItem"
          class="fss w70 column form-line"
        ></app-item>
      </ng-container>
    </div>
  </ng-container>
</app-page-layout>
