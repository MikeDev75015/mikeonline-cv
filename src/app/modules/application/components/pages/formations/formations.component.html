<app-page-layout
  sectionId="FORMATIONS"
  [pageTitle]="'components.formations.title'"
  [elementsNumber]="formationList ? formationList.length : 0"
  [isLoadingData$]="isLoadingData$"
  >
  @if (formationList) {
    <div class="exp w100 column fsc" aria-labelledby="formations content">
      @for (form of formationList; track form; let i = $index) {
        <app-item
          [id]="'formation-item-' + i" [index]="i" [itemData]="form" [showDetails]="true"
          class="fss w70 column form-line" itemType="formationItem"
        ></app-item>
      }
    </div>
  }
</app-page-layout>
