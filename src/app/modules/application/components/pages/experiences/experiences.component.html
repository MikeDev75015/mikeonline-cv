<app-page-layout
  sectionId="EXPERIENCES"
  [pageTitle]="'components.experiences.title'"
  [elementsNumber]="experienceList ? experienceList.length : 0"
  [isLoadingData$]="isLoadingData$"
  >
  @if (experienceList) {
    <div class="exp w100 column fsc" aria-labelledby="experiences content">
      @for (exp of experienceList; track exp; let i = $index) {
        <app-item
          [id]="'experience-item-' + i" [index]="i" [itemData]="exp" [showDetails]="true"
          class="fss w70 column exp-line" itemType="experienceItem"
        ></app-item>
      }
    </div>
  }
</app-page-layout>
