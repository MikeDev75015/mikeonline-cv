<app-page-layout
  sectionId="INTERESTS"
  [pageTitle]="'components.interests.title'"
  [elementsNumber]="interestList ? interestList.length : 0"
  [isLoadingData$]="isLoadingData$"
  [scrollSection]="true"
  >
  @if (interestList) {
    <div class="fcs w100" aria-labelledby="interests content">
      <app-vertical-accordion
        class="vertical-accordion"
        [verticalAccordionContainerClass]="'vertical-accordion-container'"
        [verticalAccordionItemClass]="'vertical-accordion-item'"
        [itemList]="interestList"
      ></app-vertical-accordion>
    </div>
  }
</app-page-layout>
