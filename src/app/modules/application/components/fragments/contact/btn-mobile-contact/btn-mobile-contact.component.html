<div
  [class]="'btn-background' + (btnClass ? ' ' + btnClass : '')"
  >

  @if (btnIcon) {
    <figure>
      <i [class]="btnIcon"></i>
    </figure>
  }

  @if (btnImage && !btnIcon) {
    <figure>
      <img [alt]="btnImage.alt" [src]="btnImage.src">
    </figure>
  }

  @if (btnText) {
    <p>{{ btnText }}</p>
  }

</div>
