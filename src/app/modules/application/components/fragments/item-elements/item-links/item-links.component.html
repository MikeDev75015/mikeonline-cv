@if (linkList) {
  <div class="fsc w100">
    @for (link of linkList; track link) {
      @if (link.description === 'Certificat') {
        <button
          (click)="onClickLink(link)" [pTooltip]="link.title"
          class="p-button-link" label=" " pButton pRipple tooltipPosition="bottom" type="button"
          ><i class="fas fa-user-graduate"></i></button>
        }
        @if (link.description === 'Cours') {
          <button
            (click)="onClickLink(link)" [pTooltip]="link.title"
            class="p-button-link" label=" " pButton pRipple tooltipPosition="bottom" type="button"
            ><i class="fas fa-book"></i></button>
          }
          @if (link.description === 'Organisme') {
            <button
              (click)="onClickLink(link)" [pTooltip]="link.title"
              class="p-button-link" label=" " pButton pRipple tooltipPosition="bottom" type="button"
              ><i class="fas fa-university"></i></button>
            }
          }
        </div>
      }
