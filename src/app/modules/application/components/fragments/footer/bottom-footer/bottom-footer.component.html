<div class="fcc w100 h100 relative">
  <p (click)="onCopyrightClick()" [ngClass]="{'column': mobile}" class="fcc" style="cursor: pointer; margin-bottom: 0;">
    <span>{{ credits.copyright }}</span>
    {{ !mobile ? '&nbsp;' : '' }}
    <span>{{ credits.owner }}</span>
  </p>

  @if (!mobile) {
    <button
      class="p-button-rounded p-button-text p-button-plain absolute bottom-footer-admin-button"
      icon="pi pi-user-edit" pButton pRipple routerLink="/admin"
      type="button"
    ></button>
  }
</div>
