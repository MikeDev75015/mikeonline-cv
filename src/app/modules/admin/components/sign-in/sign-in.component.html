<p-toast key="applicationError" position="center"></p-toast>

<div class="fcc column full-screen">

  <app-input-wrapper
    (valueChange)="onValueChange($event, 'username')" [(value)]="username" inputType="text"
  ></app-input-wrapper>

  <app-input-wrapper
    (valueChange)="onValueChange($event, 'userPassword')" [(value)]="userPassword" inputType="password"
  ></app-input-wrapper>

  <button (click)="onLogin()" class="fcc" pButton style="width: 250px; margin-top: 20px;">
    <div class="fcc w100">
      <span>Se connecter</span>
      <mat-icon style="margin-left: 10px;">login</mat-icon>
    </div>
  </button>

  <a class="fcc" style="width: 250px; margin-top: 20px; text-decoration: none; color: var(--primary-color);" routerLink="/">Voir le site</a>

</div>
