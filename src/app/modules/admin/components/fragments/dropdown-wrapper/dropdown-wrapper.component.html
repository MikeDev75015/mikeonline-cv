<p-dropdown
  (ngModelChange)="onSelectedValueChange()" [(ngModel)]="selectedValue"
  [disabled]="!dropdownList || !dropdownList.length" [ngStyle]="inlineStyle"
  [options]="dropdownList" [scrollHeight]="scrollHeight"
  [styleClass]="inlineClass" optionLabel="label"
  optionValue="value"
></p-dropdown>
