<div
  *ngIf="availableList && selectedList" [ngClass]="{w100: !inlineStyle || !inlineStyle['width']}"
  [ngStyle]="inlineStyle"
  class="fcc column pick-list-wrapper-container"
>
  <p-pickList
    #pickListWrapped [dragdrop]="dragdrop" [filterBy]="filterBy" [showSourceControls]="showSourceControls"
    [showSourceFilter]="showSourceFilter" [showTargetControls]="showTargetControls"
    [showTargetFilter]="showTargetFilter"
    [sourceFilterPlaceholder]="sourceFilterPlaceholder" [sourceHeader]="sourceHeader"
    [source]="availableList" [stripedRows]="stripedRows"
    [styleClass]="inlineClass || ''" [targetFilterPlaceholder]="targetFilterPlaceholder" [targetHeader]="targetHeader"
    [target]="selectedList"
  >
    <ng-template let-item pTemplate="item">
      <div class="fbc w100 pick-list-item-wrapped">
        <span>{{ propertyToDisplay ? item[propertyToDisplay] : item }}</span>
      </div>
    </ng-template>
  </p-pickList>

  <div class="fcc w100 pick-list-buttons-wrapped">
    <button
      (click)="onCloseOverlayPanel()" class="p-button-text" icon="pi pi-times" label="Annuler" pButton pRipple
    ></button>
    <button
      (click)="onSaveData()" class="p-button-text" icon="pi pi-check" label="Enregistrer" pButton pRipple
    ></button>
  </div>
</div>
