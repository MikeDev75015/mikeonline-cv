<p-toast></p-toast>

<div class="card">
  <p-toolbar styleClass="mb-4">
    <ng-template pTemplate="left">
      <button pButton pRipple label="Ajouter" icon="pi pi-plus" class="p-button-success mr-2" (click)="openNew()"></button>
      <button pButton pRipple label="Supprimer" icon="pi pi-trash" class="p-button-danger" (click)="deleteSelectedElements()" [disabled]="!selectedProducts || !selectedProducts.length"></button>
    </ng-template>

    <ng-template pTemplate="right">
      <button pButton pRipple label="Export" icon="pi pi-upload" class="p-button-help"></button>
    </ng-template>
  </p-toolbar>

  <p-table
    [columns]="columnList" [value]="tableData" [paginator]="true" [rows]="15" [showCurrentPageReport]="true"
    [(selection)]="selectedProducts" [rowHover]="true"
    [resizableColumns]="true" styleClass="p-datatable-gridlines" dataKey="id"
    currentPageReportTemplate="{first} à {last} éléments sur {totalRecords}" [rowsPerPageOptions]="[5, 10, 15, 25, 50, 100]"
  >

    <ng-template pTemplate="header" let-columns>
      <tr class="fss w100">
        <th class="fcc" scope="col" style="width: 54px; min-width: 54px; max-width: 54px;">
          <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
        </th>

        <ng-container *ngFor="let col of columns">
          <th pResizableColumn>{{ col.header }}</th>
        </ng-container>

        <th *ngIf="crudEndPoint" scope="col" style="width: 120px; max-width: 120px; min-width: 120px;">Actions</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-rowData let-columns="columns">
      <tr>
        <td>
          <p-tableCheckbox [value]="rowData"></p-tableCheckbox>
        </td>

        <ng-container *ngFor="let col of columns">
          <td [pEditableColumn]="true">
            <p-cellEditor>
              <ng-template pTemplate="input">
                <app-input-wrapper inputType="text" [(value)]="rowData[col.field]"></app-input-wrapper>
              </ng-template>
              <ng-template pTemplate="output">
                {{ rowData[col.field] }}
              </ng-template>
            </p-cellEditor>
          </td>
        </ng-container>

        <td>
          <button pButton pRipple icon="pi pi-pencil" class="p-button-rounded p-button-success mr-2" (click)="editElement(rowData)"></button>
          <button pButton pRipple icon="pi pi-trash" class="p-button-rounded p-button-warning" (click)="deleteElement(rowData)"></button>
        </td>
      </tr>
    </ng-template>

  </p-table>
</div>

<p-dialog [(visible)]="addElementDialog" [style]="{width: '450px'}" header="Product Details" [modal]="true" styleClass="p-fluid">
  <ng-template pTemplate="content">
  </ng-template>

  <ng-template pTemplate="footer">
    <button pButton pRipple label="Cancel" icon="pi pi-times" class="p-button-text" (click)="hideDialog()"></button>
    <button pButton pRipple label="Save" icon="pi pi-check" class="p-button-text" (click)="saveNewElement()"></button>
  </ng-template>
</p-dialog>

<p-confirmDialog [style]="{width: '450px'}"></p-confirmDialog>
