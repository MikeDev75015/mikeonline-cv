<div [ngStyle]="{width: '100%', height: inputHeight}" class="fss relative input-number-wrapped">
  <input
    #inputNumberWrapped (ngModelChange)="onValueChange($event)" [(ngModel)]="value" [class]="inlineClass || ''"
    [disabled]="disabled" [ngStyle]="{width: '100%', 'max-height': inputHeight}"
    data-cy="input-number" pInputText type="number"
  />
</div>
