<div [ngStyle]="{width: '100%', height: inputHeight}" class="fss relative input-password-wrapped">
  <input
    #inputPasswordWrapped (ngModelChange)="onValueChange($event)" [(ngModel)]="value" [class]="inlineClass"
    [disabled]="disabled" [ngStyle]="{width: '100%', height: inputHeight}" [type]="type" data-cy="input-password"
    pInputText
  />

  <div
    (click)="toggleType()" [ngStyle]="{width: '' + inputHeight, height: inputHeight}" class="fcc absolute"
    style="top: 0; right: 0;"
  >
    <i [class]="type === 'password' ? 'pi pi-eye' : 'pi pi-eye-slash'"></i>
  </div>
</div>
