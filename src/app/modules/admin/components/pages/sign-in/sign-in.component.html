<p-toast data-cy="primeng-toast" key="applicationError" position="center"></p-toast>

<div class="fcc column full-screen" data-cy="sign-in content">

  <app-form-wrapper
    (formValuesChange)="onFormValueChange($event)" [(formValues)]="formValues" [formFields]="formFields"
    data-cy="form-fields" style="width: 250px;"
  ></app-form-wrapper>

  <button (click)="onLogin()" class="fcc" data-cy="submit-button" pButton style="width: 250px; margin-top: 20px;">
    <div class="fcc w100">
      <span>Se connecter</span>
      <mat-icon style="margin-left: 10px;">login</mat-icon>
    </div>
  </button>

  <a class="fcc" data-cy="app-button" routerLink="/"
     style="width: 250px; margin-top: 20px; text-decoration: none; color: var(--primary-color);">Voir le site</a>

</div>
