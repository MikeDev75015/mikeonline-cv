<p-toast data-cy="primeng-toast" key="applicationError" position="center"></p-toast>

<ng-container *appLoading="!currentUser">
  @if (tabItems) {
    <div class="fbc w100 admin-layout-header" data-cy="admin-layout-header">
      <div class="admin-tab-menu fss" data-cy="admin-tab-menu">
        @for (item of tabItems; track item) {
          <button
            [routerLink]="item.routerLink"
            class="p-button-text"
            pButton
            type="button"
          >
            {{ item.label }}
          </button>
        }
      </div>
      <div class="fec">
        <div class="fcc">
          <span>Thème :</span>&nbsp;
          <app-dropdown-wrapper
            (selectedValueChange)="onSelectedThemeChange($event)" [(selectedValue)]="selectedTheme"
            [inlineStyle]="{'margin-right': '10px'}"
            [scrollHeight]="'80vh'" [stringList]="themeList"
          ></app-dropdown-wrapper>
        </div>
        @if (currentUser) {
          <span [pTooltip]="currentUser.role" data-cy="current-user-name" style="margin-right: 10px;"
            tooltipPosition="bottom">
            Utilisateur: {{ currentUser.name }}
          </span>
          <button (click)="menu.toggle($event)" data-cy="menu-button" pButton type="button">
            <mat-icon>menu</mat-icon>
          </button>
          <p-menu #menu [model]="rightItems" [popup]="true" data-cy="primeng-menu"></p-menu>
        }
      </div>
    </div>
  }

  <router-outlet></router-outlet>
</ng-container>
