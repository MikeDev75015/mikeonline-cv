<section [id]="sectionId" class="fsc column w100" style="padding-bottom: 100px;">
  <ng-container *appLoading="isLoadingData | async">
    <h3 class="animated-background">
    <span>
      {{ pageTitle }}
      <span *ngIf="elementsNumber" class="badge-element">{{ elementsNumber }}</span>
    </span>
    </h3>

    <ng-content></ng-content>

  </ng-container>
</section>
