<div
  [ngStyle]="{width: inputWidth, height: inputType === 'textarea' ? 'auto' : inputHeight}"
  class="fss relative input-wrapper-container" data-cy="input-wrapper-container"
>

  <ng-container *ngIf="inputType === 'text'">
    <app-input-text
      (valueChange)="onValueChange($event)" [(value)]="inputValue" [class]="inlineClass" data-cy="input-text-wrapper"
      [disabled]="disabled" [name]="name"
      [ngStyle]="{width: inputWidth, height: inputHeight}" [placeholder]="placeholder"
    ></app-input-text>
  </ng-container>

  <ng-container *ngIf="inputType === 'password'">
    <app-input-password
      (valueChange)="onValueChange($event)" [(value)]="inputValue" [class]="inlineClass"
      data-cy="input-password-wrapper"
      [disabled]="disabled" [name]="name"
      [ngStyle]="{width: inputWidth, height: inputHeight}" [placeholder]="placeholder"
    ></app-input-password>
  </ng-container>

  <ng-container *ngIf="inputType === 'number'">
    <app-input-number
      (valueChange)="onValueChange($event)" [(value)]="inputValue" [class]="inlineClass" data-cy="input-number-wrapper"
      [disabled]="disabled" [max]="numberOptions.max"
      [min]="numberOptions.min" [name]="name" [ngStyle]="{width: inputWidth, height: inputHeight}"
      [placeholder]="placeholder" [step]="numberOptions.step"
    ></app-input-number>
  </ng-container>

  <ng-container *ngIf="inputType === 'textarea'">
    <app-input-textarea
      (valueChange)="onValueChange($event)" [(value)]="inputValue" [class]="inlineClass"
      data-cy="input-textarea-wrapper"
      [disabled]="disabled" [name]="name" [ngStyle]="{width: inputWidth, height: 'auto'}"
      [placeholder]="placeholder" [rows]="textareaOptions.rows"
    ></app-input-textarea>
  </ng-container>

  <ng-container *ngIf="inputType === 'checkbox'">
    <app-input-checkbox
      (valueChange)="onValueChange($event)" [(value)]="inputValue" [class]="inlineClass"
      data-cy="input-checkbox-wrapper"
      [disabled]="disabled" [labelPlacement]="checkboxOptions.labelPlacement"
      [label]="checkboxOptions.label"
      [name]="name" [ngStyle]="{width: inputWidth, height: 'auto'}"
    ></app-input-checkbox>
  </ng-container>
</div>
