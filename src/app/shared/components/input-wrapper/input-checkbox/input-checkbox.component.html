<div [ngStyle]="{width: '100%', height: inputHeight}" class="fss relative input-checkbox-wrapped">

  @if (label && labelPlacement === 'before') {
    <label style="margin-right: 5px;">{{ label }}</label>
  }

  <p-checkbox
    #inputCheckboxWrapped (ngModelChange)="onValueChange($event)" [(ngModel)]="value" data-cy="input-checkbox"
    [binary]="true" [disabled]="disabled"
    [ngStyle]="{width: '100%', height: inputHeight}" [styleClass]="inlineClass || ''"
  ></p-checkbox>

  @if (label && labelPlacement === 'after') {
    <label style="margin-left: 5px;">{{ label }}</label>
  }

</div>
