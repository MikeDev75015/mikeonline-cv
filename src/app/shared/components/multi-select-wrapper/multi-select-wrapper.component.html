<p-multiSelect
  (ngModelChange)="onSelectedValuesChange($event)" [(ngModel)]="selectedValues" [appendTo]="appendTo"
  [options]="optionList"
  [placeholder]="placeholder || 'Sélectionner'"
  [selectedItemsLabel]="'{0} sélectionné' + (selectedValues.length > 1 ? 's' : '')"
  [selectionLimit]="selectionLimit || optionList.length"
  [class]="inlineClass || ''"
  display="chip" optionLabel="label"
  optionValue="value"
></p-multiSelect>
