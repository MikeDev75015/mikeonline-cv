version: 2.1

orbs:
  slack: circleci/slack@4.3.0
  jira: circleci/jira@1.3.1

commands:
  dependencies-in-cache:
    description: "restore / save dependencies cache"
    steps:
      - restore_cache:
          keys:
            - v1-dependencies-{{ .Branch }}-{{ checksum "package-lock.json" }}
            - v1-dependencies-{{ .Branch }}-
            - v1-dependencies-
      - run: npm install
      - save_cache:
          key: v1-dependencies-{{ .Branch }}-{{ checksum "package-lock.json" }}
          paths:
            - node_modules

jobs:
  ci-build-job-staging:
    docker:
      - image: circleci/node:12.18.1
    resource_class: small
    steps:
      - checkout
      - dependencies-in-cache
      - run: npm run build-staging
      - persist_to_workspace:
          root: .
          paths:
            - 'dist/staging'
            - firebase.json
            - .firebaserc
            - firestore.rules
            - firestore.indexes.json

  ci-build-job-production:
    docker:
      - image: circleci/node:12.18.1
    resource_class: small
    steps:
      - checkout
      - dependencies-in-cache
      - run: npm run build-prod
      - persist_to_workspace:
          root: .
          paths:
            - 'dist/production'
            - firebase.json
            - .firebaserc
            - firestore.rules
            - firestore.indexes.json

  ci-test-job:
    docker:
      - image: circleci/node:12.18.1
    resource_class: small
    steps:
      - checkout
      - dependencies-in-cache
      - run:
          name: Run tests with JUnit as reporter
          command: npx jest --ci --runInBand
          environment:
            JEST_JUNIT_OUTPUT_DIR: ./reports/junit/
      - store_test_results:
          path: ./reports/junit/
      - store_artifacts:
          path: ./reports/junit

  cd-deploy-job-firebase-staging:
    docker:
      - image: circleci/node:lts
    resource_class: small
    steps:
      - checkout
      - dependencies-in-cache
      - attach_workspace:
          at: .
      - run:
          name: Firebase Deploy
          command: ./node_modules/.bin/firebase deploy --project cv-mikeonline --token "$FIREBASE_DEPLOY_TOKEN" --only hosting:cv-mikeonline-staging

  cd-deploy-job-firebase-production:
    docker:
      - image: circleci/node:lts
    resource_class: small
    steps:
      - checkout
      - dependencies-in-cache
      - attach_workspace:
          at: .
      - run:
          name: Firebase Deploy
          command: ./node_modules/.bin/firebase deploy --project cv-mikeonline --token "$FIREBASE_DEPLOY_TOKEN" --only hosting:cv-mikeonline

  notify-success-job:
    docker:
      - image: cimg/base:2020.01
    resource_class: small
    steps:
      - slack/notify:
          event: always
          template: basic_success_1

  notify-waiting-for-approval:
    docker:
      - image: cimg/base:2020.01
    resource_class: small
    steps:
      - slack/notify:
          event: always
          template: ''
          custom: '{
                     	"blocks": [
                     		{
                     			"type": "actions",
                     			"elements": [
                     				{
                     					"type": "button",
                     					"text": {
                     						"type": "plain_text",
                     						"emoji": true,
                     						"text": "Approuver ou refuser"
                     					},
                     					"style": "danger",
                     					"url": "https://circleci.com/workflow-run/${CIRCLE_WORKFLOW_ID}"
                     				}
                     			]
                     		},
                     		{
                     			"type": "section",
                     			"fields": [
                     				{
                     					"type": "mrkdwn",
                     					"text": "*Projet:*\n$CIRCLE_PROJECT_REPONAME"
                     				},
                     				{
                     					"type": "mrkdwn",
                     					"text": "*Branche:*\n$CIRCLE_BRANCH"
                     				},
                     				{
                     					"type": "mrkdwn",
                     					"text": "*Etape:*\n$CIRCLE_JOB"
                     				}
                     			]
                     		}
                     	]
                     }'

workflows:
  ##################################### DEFAULT WORKFLOW - ignore test/.*, master & develop #####################################
  ci-default-workflow:
    jobs:
      - ci-test-job:
          filters:
            branches:
              ignore:
                - master
                - develop
                - /test\/.*/
      - ci-build-job-staging:
          requires:
            - ci-test-job
          filters:
            branches:
              ignore:
                - master
                - develop
                - /test\/.*/

  ##################################### TEST WORKFLOW - only test/.* #####################################################
  ci-cd-workflow-test:
    jobs:
      - ci-build-job-staging:
          #          requires:
          #            - ci-test-job
          filters:
            branches:
              only:
                - /test\/.*/
      - cd-deploy-job-firebase-staging:
          requires:
            - ci-build-job-staging
          context: FIREBASE
          filters:
            branches:
              only:
                - /test\/.*/
      - notify-success-job:
          requires:
            - ci-build-job-staging
            - cd-deploy-job-firebase-staging
          context: SLACK
          filters:
            branches:
              only:
                - /test\/.*/

  ##################################### STAGING WORKFLOW - only develop ################################################
  ci-cd-workflow-staging:
    jobs:
      - ci-test-job:
          filters:
            branches:
              only:
                - develop
      - ci-build-job-staging:
          requires:
            - ci-test-job
          filters:
            branches:
              only:
                - develop
      - cd-deploy-job-firebase-staging:
          requires:
            - ci-test-job
            - ci-build-job-staging
          context: FIREBASE
          post-steps:
            - jira/notify:
                environment_type: staging
                job_type: deployment
          filters:
            branches:
              only:
                - develop
      - notify-success-job:
          requires:
            - cd-deploy-job-firebase-staging
          context: SLACK
          filters:
            branches:
              only:
                - develop

  ##################################### PRODUCTION WORKFLOW - only master ##############################################
  ci-cd-workflow-production:
    jobs:
      - ci-test-job:
          filters:
            branches:
              only:
                - master
      - ci-build-job-production:
          requires:
            - ci-test-job
          filters:
            branches:
              only:
                - master
      - notify-waiting-for-approval:
          requires:
            - ci-test-job
            - ci-build-job-production
          context: SLACK
          filters:
            branches:
              only:
                - master
      - approval-cd-deploy-production:
          type: approval
          requires:
            - ci-test-job
            - ci-build-job-production
            - notify-waiting-for-approval
          filters:
            branches:
              only:
                - master
      - cd-deploy-job-firebase-production:
          requires:
            - approval-cd-deploy-production
          context: FIREBASE
          post-steps:
            - jira/notify:
                environment_type: production
                job_type: deployment
          filters:
            branches:
              only:
                - master
      - notify-success-job:
          requires:
            - cd-deploy-job-firebase-production
          context: SLACK
          filters:
            branches:
              only:
                - master
