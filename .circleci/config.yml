version: 2.1

orbs:
  sonarcloud: sonarsource/sonarcloud@1.0.3
  jira: circleci/jira@1.3.1
  jq: circleci/jq@2.2.0
  cypress: cypress-io/cypress@1.29.0

executors:
  cypress-base-16-with-chrome-and-firefox:
    docker:
      - image: "cypress/browsers:node14.17.0-chrome88-ff89"

commands:
  dependencies-in-cache:
    description: "restore / save dependencies cache"
    steps:
      - restore_cache:
          keys:
            - v1-dependencies-{{ .Branch }}-{{ checksum "package-lock.json" }}
            - v1-dependencies-{{ .Branch }}-
            - v1-dependencies-
      - run: npm install
      - save_cache:
          key: v1-dependencies-{{ .Branch }}-{{ checksum "package-lock.json" }}
          paths:
            - node_modules

  git-config-local-user:
    description: 'Configure the default identity for the git account'
    steps:
      - run:
          name: Set credentials cache
          command: git config credential.helper 'cache --timeout=120'
      - run:
          name: Set user email
          command: git config user.email ${GIT_USER_EMAIL}
      - run:
          name: Set user name
          command: git config user.name ${GIT_USER_NAME}

  push-sonar-tag:
    description: Push tag to run sonarcloud scan
    steps:
      - run: git tag -f sonar && git push -f https://${SONAR_REPO_USER}:${SONAR_REPO_PASS}@bitbucket.org/${SONAR_REPO_TEAM}/${SONAR_REPO_NAME}.git sonar

  cypress-post-steps:
    description: Store test results and report as an artifact
    steps:
      - run:
          name: Combine junit xml reports and delete once combined
          command: |
            npm run merge-reports:ci
            rm -r -f ./cypress/results/files
      - run: echo 'Successfully combined'
      - store_test_results:
          path: cypress/results
      - store_artifacts:
          path: cypress/results
      - store_artifacts:
          path: cypress/report
      - store_artifacts:
          path: cypress/screenshots
      - store_artifacts:
          path: cypress/videos

jobs:
  ci-build-job:
    docker:
      - image: cimg/node:16.13.1
    parameters:
      production:
        type: boolean
        default: false
    steps:
      - checkout
      - dependencies-in-cache
      - when:
          condition:
            not: << parameters.production >>
          steps:
            - run: npm run build-staging
            - persist_to_workspace:
                root: .
                paths:
                  - 'dist/staging'
                  - firebase.json
                  - .firebaserc
                  - firestore.rules
                  - firestore.indexes.json
      - when:
          condition:
            << parameters.production >>
          steps:
            - run: npm run build-prod
            - persist_to_workspace:
                root: .
                paths:
                  - 'dist/production'
                  - firebase.json
                  - .firebaserc
                  - firestore.rules
                  - firestore.indexes.json

  ci-test-job:
    docker:
      - image: cimg/node:16.13.1
    parallelism: 15
    parameters:
      sonarcloud:
        type: boolean
        default: false
    steps:
      - checkout
      - dependencies-in-cache
      - when:
          condition:
            not: << parameters.sonarcloud >>
          steps:
            - run:
                name: Split and Run tests with JUnit as reporter
                command: |
                  TESTFILES=$(circleci tests glob "src/**/*.spec.ts" | circleci tests split --split-by=timings)
                  npm run test:ci $TESTFILES
                environment:
                  JEST_JUNIT_OUTPUT_DIR: ./reports/junit
            - store_test_results:
                path: ./reports/junit
            - store_artifacts:
                path: ./reports/junit
      - when:
          condition: << parameters.sonarcloud >>
          steps:
            - run:
                name: Run tests with JUnit as reporter
                command: npm run test:ci
                environment:
                  JEST_JUNIT_OUTPUT_DIR: ./reports/junit/
            - store_test_results:
                path: ./reports/junit/
            - store_artifacts:
                path: ./reports/junit
            - sonarcloud/scan

  ci-sonar-job:
    docker:
      - image: cimg/node:16.13.1
    steps:
      - checkout
      - dependencies-in-cache
      - push-sonar-tag

  cd-release-job:
    docker:
      - image: cimg/node:16.13.1
    steps:
      - checkout
      - dependencies-in-cache
      - git-config-local-user
      - run:
          name: Checkout to develop
          command: git checkout develop
      - run:
          name: Pull develop
          command: git pull https://${REPO_USER}:${REPO_PASS}@bitbucket.org/${REPO_TEAM}/${REPO_NAME}.git develop
      - run:
          name: Run standard-version without generate tag
          command: npm run release -- --skip.tag
      - run:
          name: Push develop with the new version commit
          command: git push https://${REPO_USER}:${REPO_PASS}@bitbucket.org/${REPO_TEAM}/${REPO_NAME}.git develop
      - run:
          name: Checkout to master
          command: git checkout master
      - run:
          name: Pull master
          command: git pull https://${REPO_USER}:${REPO_PASS}@bitbucket.org/${REPO_TEAM}/${REPO_NAME}.git master
      - run:
          name: Merge develop in master
          command: git merge develop --ff-only
      - run:
          name: Push master
          command: git push https://${REPO_USER}:${REPO_PASS}@bitbucket.org/${REPO_TEAM}/${REPO_NAME}.git master
      - run:
          name: create new tag with the package.json version number and push it to the repository
          command: |
            VERSION_NUMBER=v$(jq -r '.version' package.json)
            echo ${VERSION_NUMBER}
            git tag ${VERSION_NUMBER}
            git push https://${REPO_USER}:${REPO_PASS}@bitbucket.org/${REPO_TEAM}/${REPO_NAME}.git ${VERSION_NUMBER}
      - run: echo 'success'

  cd-deploy-firebase-job:
    docker:
      - image: cimg/node:16.13.1
    parameters:
      hosting:
        type: string
        default: cv-mikeonline-staging
    steps:
      - checkout
      - dependencies-in-cache
      - attach_workspace:
          at: .
      - run:
          name: Firebase Deploy
          command: ./node_modules/.bin/firebase deploy --project cv-mikeonline --token "$FIREBASE_DEPLOY_TOKEN" --only hosting:<< parameters.hosting >>

workflows:
  ##################################### DEFAULT WORKFLOW - ignore master & develop #####################################
  ci-default-workflow:
    jobs:
      - ci-test-job:
          filters:
            branches:
              ignore:
                - master
                - develop

  ######################################### CYPRESS WORKFLOW - on cypress TAG ##########################################
  ci-cypress-workflow:
    when:
      equal: [ << pipeline.git.tag >>, cypress ]
    jobs:
      - cypress/install:
          name: ci-cypress-install-job
          executor: cypress-base-16-with-chrome-and-firefox
          filters:
            branches:
              ignore: /.*/
            tags:
              only: cypress
      - cypress/run:
          name: ci-cypress-run-job
          context: CYPRESS_ENV
          requires:
            - ci-cypress-install-job
          executor: cypress-base-16-with-chrome-and-firefox
          ci-build-id: 'testing-commit-${CIRCLE_SHA1}'
          parallelism: 4
          command: |
            CYPRESSFILES=$(circleci tests glob "cypress/integration/**/*_spec.js" | circleci tests split --split-by=timings)
            npm run cypress:ci $CYPRESSFILES
          start: npm run cypress-server
          wait-on: 'http://localhost:4201'
          no-workspace: true
          post-steps:
            - cypress-post-steps
          filters:
            branches:
              ignore: /.*/
            tags:
              only: cypress

  ######################################## SONAR CLOUD WORKFLOW - on sonar TAG #########################################
  ci-sonar-workflow:
    when:
      equal: [ << pipeline.git.tag >>, sonar ]
    jobs:
      - ci-test-job:
          context: OCV_SONARCLOUD
          sonarcloud: true
          filters:
            branches:
              ignore: /.*/
            tags:
              only: sonar

  ##################################### DEPLOY TEST WORKFLOW - on deploy TAG ###########################################
  ci-cd-deploy-test-workflow:
    when:
      equal: [ << pipeline.git.tag >>, deploy ]
    jobs:
      - ci-build-job:
          post-steps:
            - jira/notify:
                environment_type: testing
                job_type: build
          filters:
            branches:
              ignore: /.*/
            tags:
              only: deploy
      - cd-deploy-firebase-job:
          requires:
            - ci-build-job
          context: FIREBASE
          post-steps:
            - jira/notify:
                environment_type: testing
                job_type: deployment
          filters:
            branches:
              ignore: /.*/
            tags:
              only: deploy

  ##################################### STAGING WORKFLOW - only develop ################################################
  ci-cd-deploy-staging-workflow:
    jobs:
      - ci-test-job:
          filters:
            branches:
              only:
                - develop
      - cypress/install:
          executor: cypress-base-16-with-chrome-and-firefox
          filters:
            branches:
              only:
                - develop
      - cypress/run:
          name: ci-cypress-job
          requires:
            - ci-test-job
            - cypress/install
          executor: cypress-base-16-with-chrome-and-firefox
          ci-build-id: 'testing-commit-${CIRCLE_SHA1}'
          browser: chrome
          parallelism: 14
          parallel: true
          record: true
          group: all-test
          command: npx cypress run --record --key 3e7233f2-3112-46a9-b9c5-7c70dbb71f99 --parallel --group all-test
          start: npm run cypress-server
          wait-on: 'http://localhost:4201'
          no-workspace: true
          store_artifacts: true
          post-steps:
            - cypress-post-steps
          filters:
            branches:
              only:
                - develop
      - ci-build-job:
          requires:
            - ci-test-job
            - ci-cypress-job
          post-steps:
            - jira/notify:
                environment_type: staging
                job_type: build
          filters:
            branches:
              only:
                - develop
      - cd-deploy-firebase-job:
          name: cd-deploy-staging-job
          requires:
            - ci-build-job
          context: FIREBASE
          hosting: cv-mikeonline-staging
          post-steps:
            - jira/notify:
                environment_type: staging
                job_type: deployment
          filters:
            branches:
              only:
                - develop
      - ci-sonar-job:
          context: OCV_SONARCLOUD
          requires:
            - cd-deploy-staging-job
          filters:
            branches:
              only:
                - develop

  ##################################### RELEASE WORKFLOW - on release TAG ##############################################
  cd-release-workflow:
    when:
      equal: [ << pipeline.git.tag >>, release ]
    jobs:
      - cd-release-job:
          context:
            - GIT
            - REPOS
          filters:
            branches:
              ignore: /.*/
            tags:
              only: release

  ################################## DEPLOY PRODUCTION WORKFLOW - only [version] TAG ###################################
  ci-cd-deploy-production-workflow:
    when: << pipeline.git.tag >>
    jobs:
      - ci-build-job:
          production: true
          post-steps:
            - jira/notify:
                environment_type: production
                job_type: build
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+$/
      - cd-deploy-firebase-job:
          name: cd-deploy-production-job
          requires:
            - ci-build-job
          context: FIREBASE
          hosting: cv-mikeonline
          post-steps:
            - jira/notify:
                environment_type: production
                job_type: deployment
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+$/
